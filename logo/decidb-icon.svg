<svg xmlns="http://www.w3.org/2000/svg" viewBox="53 29 275 275" width="256" height="256">
  <!-- Square app-icon form of the DecidB mark, taken from logo/decidb-logo.svg
       (the same artwork the website serves). Used for the Windows executable:
       logo/decidb.ico, referenced by tools/shell/rc/duckdb.rc.

       Three deliberate differences from the wordmark, so the mark survives at
       16px and so ImageMagick can render it with a real alpha channel:
         - the "DeciDB" lettering is dropped; at 16px it is mush
         - the inner rim, a 2.5px stroked ellipse at 80% opacity, is drawn as
           two filled ellipses instead (ImageMagick's SVG renderer discards
           strokes), with the opacity pre-blended into #5a8bfc
         - the check is a filled polygon rather than a stroked path, for the
           same reason; the round caps are lost, which is invisible this small

       Regenerate with:
         magick -background none logo/decidb-icon.svg \
           -define icon:auto-resize=128,64,48,32,16 -compress none logo/decidb.ico
       Classic BMP entries, no PNG-compressed 256 entry, which older rc.exe
       can reject. -->

  <g id="database-icon">
    <path d="M 60,115 V 215 A 110,48 0 0 0 280,215 V 115 Z" fill="#1536b1" />
    <ellipse cx="170" cy="115" rx="110" ry="48" fill="#2e5ee6" />
    <ellipse cx="170" cy="115" rx="106" ry="44" fill="#356cf2" />
    <ellipse cx="170" cy="115" rx="96" ry="39" fill="#5a8bfc" />
    <ellipse cx="170" cy="115" rx="93.5" ry="36.5" fill="#356cf2" />
  </g>

  <g id="check-badge">
    <circle cx="270" cy="215" r="51" fill="#009066" />
    <polygon points="254.0,212.0 265.4,223.4 287.5,191.6 294.5,196.4 266.6,236.6 248.0,218.0"
             fill="#ffffff" />
  </g>
</svg>
