<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <style>
      .brand-text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 142px;
        font-weight: 400;
        letter-spacing: -1px;
      }
      .text-blue { fill: #2349d4; }
      .text-green { fill: #009066; }
    </style>
  </defs>

  <g id="database-icon">
    <path d="M 60,115 V 215 A 110,48 0 0 0 280,215 V 115 Z" fill="#1536b1" />
    
    <ellipse cx="170" cy="115" rx="110" ry="48" fill="#2e5ee6" />
    
    <ellipse cx="170" cy="115" rx="106" ry="44" fill="#356cf2" />
    
    <ellipse cx="170" cy="115" rx="96" ry="39" fill="none" stroke="#6393ff" stroke-width="2.5" opacity="0.8" />
  </g>

  <g id="check-badge">
    <circle cx="270" cy="215" r="51" fill="#009066" />
    
    <path d="M 251,215 L 266,230 L 291,194" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="8.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <text x="365" y="215" class="brand-text">
    <tspan class="text-blue">Deci</tspan><tspan class="text-green">DB</tspan>
  </text>
</svg>
